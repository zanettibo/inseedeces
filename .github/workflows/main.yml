name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests & Security
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    services:
      db:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: insee_deces
          MYSQL_USER: insee
          MYSQL_PASSWORD: ci_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: mysql://root:ci_root@127.0.0.1:3306/insee_deces
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CELERY_BROKER_URL: redis://localhost:6379/0
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_API_KEY: ci-key
      GEMINI_API_KEY: ci-key

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test deces --verbosity=2

  build:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.HUB_USERNAME }}
          password: ${{ secrets.HUB_PASSWORD }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: zanettibo/inseedeces

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pr:
    name: Build PR image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.HUB_USERNAME }}
          password: ${{ secrets.HUB_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: zanettibo/inseedeces:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-pr:
    name: Cleanup PR image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Delete PR image from Docker Hub
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"${{ secrets.HUB_USERNAME }}","password":"${{ secrets.HUB_PASSWORD }}"}' \
            | jq -r .token)
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            "https://hub.docker.com/v2/repositories/zanettibo/inseedeces/tags/pr-${{ github.event.pull_request.number }}/")
          echo "DELETE response: $HTTP"
          [ "$HTTP" = "204" ] || [ "$HTTP" = "404" ]
