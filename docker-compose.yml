services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: insee_deces
      MYSQL_USER: insee
      MYSQL_PASSWORD: insee_password
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine

  meilisearch:
    image: getmeili/meilisearch:v1.6
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    environment:
      MEILI_MASTER_KEY: "masterKey_inseedeces_secret"

  migrate:
    build: .
    entrypoint: /usr/local/bin/docker-entrypoint-migrate.sh
    command: echo "Migrations terminées"
    environment:
      - DATABASE_URL=mysql://insee:insee_password@db:3306/insee_deces
      - DEBUG=True
    depends_on:
      - db

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql://insee:insee_password@db:3306/insee_deces
      - CELERY_BROKER_URL=redis://redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_API_KEY=masterKey_inseedeces_secret
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    depends_on:
      - db
      - redis
      - migrate
      - meilisearch

  celery:
    build: .
    command: celery -A insee_deces worker --loglevel=info
    environment:
      - DATABASE_URL=mysql://insee:insee_password@db:3306/insee_deces
      - CELERY_BROKER_URL=redis://redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_API_KEY=masterKey_inseedeces_secret
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    depends_on:
      - web
      - redis
      - db
      - migrate
      - meilisearch

volumes:
  db_data:
  meili_data:
